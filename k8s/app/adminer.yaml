# Adminer: веб-интерфейс администрирования БД (localhost:8082)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: coursehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
        - name: adminer
          image: adminer:6.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ADMINER_DEFAULT_SERVER
              value: postgres
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: adminer
  namespace: coursehub
spec:
  type: NodePort
  selector:
    app: adminer
  ports:
    - port: 8080
      nodePort: 30082
