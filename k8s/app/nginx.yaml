# Веб-сервер nginx: интерфейс и передача запросов /api/ в сервис api
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: coursehub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: coursehub-nginx:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
# NodePort — сервис доступен снаружи кластера на порту 30081 каждого узла.
# Через настройку kind этот порт проброшен на localhost:8081.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: coursehub
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      nodePort: 30081
