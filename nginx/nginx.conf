# Конфигурация веб-сервера nginx
server {
    listen 80;

    # Статические файлы интерфейса (index.html, app.js)
    root /usr/share/nginx/html;

    # Запросы к API передаются контейнеру api по имени сервиса.
    # Если реплик api несколько, nginx распределяет запросы между ними по очереди.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
